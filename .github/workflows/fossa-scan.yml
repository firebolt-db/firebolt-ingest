name: FOSSA Scan

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      FOSSA_TOKEN:
        required: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v7

      - name: "Build"
        run: |
          python3 -m pip install pipenv
          python3 -m pipenv install -e .
        shell: bash

      - name: "Run FOSSA Scan"
        uses: fossas/fossa-action@v2
        with:
          api-key: ${{ secrets.FOSSA_TOKEN }}
