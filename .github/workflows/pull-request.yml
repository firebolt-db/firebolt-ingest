name: Pull request

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  check-title:
    runs-on: ubuntu-latest
    permissions:
      # The PR title check reads the PR and posts/deletes a hint comment.
      pull-requests: write
    steps:
      - name: Check title name convention
        uses: jef/conventional-commits-pr-action@2ee589f151916f92da5e2887c38d5fe6402e803c # v1.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  code-checkers:
    uses: ./.github/workflows/code-check.yml
    permissions:
      contents: read
  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      contents: read

  security-scan:
    needs: [unit-tests]
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read
      pull-requests: read
    secrets:
      FOSSA_TOKEN: ${{ secrets.FOSSA_TOKEN }}
      SONARCLOUD_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}

