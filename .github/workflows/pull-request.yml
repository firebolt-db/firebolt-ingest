name: Pull request

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  code-checkers:
    uses: ./.github/workflows/code-check.yml
    permissions:
      contents: read
  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      contents: read

  security-scan:
    needs: [unit-tests]
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read
      pull-requests: read
    secrets:
      FOSSA_TOKEN: ${{ secrets.FOSSA_TOKEN }}
      SONARCLOUD_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}

